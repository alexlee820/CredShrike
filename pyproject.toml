[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "credshrike"
version = "0.3.0"
description = "Multi-auth SMB enumeration toolkit with LDAP/ADWS domain queries and a capability-limited LLM agent"
requires-python = ">=3.10"
dependencies = [
    "impacket>=0.10.0",
    "pycryptodomex>=3.19",   # vendored ADWS NegotiateStream (ARC4/HMAC sealing)
    "pyasn1>=0.5",           # ADWS binary XML / NMF encoding
    "PyYAML>=6.0",
    "dnspython>=2.4",
    "PySocks>=1.7",         # --socks-proxy: SMB/LDAP/ADWS via SOCKS, LLM direct
    "anthropic>=0.100",
    "Flask>=2.3",            # `credshrike ui`
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# libphonenumber + stdnum checksums for the masking detectors
pii = ["phonenumbers>=8.13", "python-stdnum>=1.20"]
# semantic PII masks (PERSON/LOCATION) — pulls torch; model downloads on first use
semantic = ["gliner>=0.2.27,<0.3"]

[project.scripts]
credshrike = "credshrike.cli:main"

[tool.setuptools.packages.find]
include = ["credshrike*"]

# the UI is a static file inside the package — without this a non-editable
# install has no credshrike/web/index.html and "/" would 404
[tool.setuptools.package-data]
credshrike = ["web/*.html", "web/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
