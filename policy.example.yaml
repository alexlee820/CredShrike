# credshrike agent policy — every cap the executor enforces.
# Copy to lab.yaml and adapt; the `profiles` section feeds `--profile`.

# ---------------------------------------------------------------- profiles
# pick with: credshrike agent --profile lab.yaml
profiles:
  corp-ntlm:
    auth_type: ntlm
    username: svc-scan
    domain: corp.local
    hashes: ":31d6cfe0d16ae931b73c59d7e0c089c0"
    kdc: dc01.corp.local          # optional KDC override for Kerberos paths
    targets: [filesrv01.corp.local]
    domain_source: ldap           # ldap | adws | auto

  corp-ticket:
    auth_type: ticket
    username: ignored-from-ticket
    domain: CORP.LOCAL
    ticket: /path/to/ticket.ccache   # or .kirbi (converted in memory)

  corp-aes:
    auth_type: aes
    username: svc-scan
    domain: CORP.LOCAL
    aes_key: <32-byte-hex aes256-cts-hmac-sha1-96>

  corp-password:
    auth_type: password
    username: jdoe
    domain: corp.local
    password: "ChangeMe!"

# ------------------------------------------------------------------- policy
policy:
  # per-tool caps (executor clamps whatever the LLM asks for)
  max_file_bytes: 262144        # 256 KiB per smb_read_file
  max_entries: 500              # per smb_list_dir
  result_char_cap: 8192         # per tool_result fed back to the model

  # per-run budgets (exhaustion -> model is asked to summarize and stop)
  max_tool_calls: 100
  max_total_read_bytes: 10485760  # 10 MiB
  wall_clock_seconds: 1800

  # session scope: empty = unrestricted (CLI may also pass --host)
  allowed_hosts: []

  # --- read gate: flag-but-don't-read for smb_read_file -------------------
  # none = model reads freely within max_file_bytes (default)
  # ai   = model chooses the file, but a request whose estimated token count
  #        (bytes / chars_per_token) exceeds max_read_tokens is flagged, not read
  # size = files whose real size (smb_stat) exceeds flag_oversize_bytes are
  #        flagged, never read — regardless of what the model asks for
  read_gate: none                # none | ai | size   (CLI: --read-gate)
  max_read_tokens: 8192          # ai mode
  chars_per_token: 4.0           # ai mode estimation ratio
  flag_oversize_bytes: 5242880   # size mode (5 MiB; CLI: --flag-oversize-mb)

  # --- redaction: scrub tool results BEFORE they reach the LLM -----------
  # literals: exact strings masked everywhere (codenames, hostnames, IPs...)
  # patterns: regexes; a capture group masks ONLY the group, keeping context:
  #   'password\s*=\s*(\S+)'  ->  "password=[REDACTED]"
  # file contents travel base64 — they are decoded, scrubbed, re-encoded.
  redact_literals: []
  # redact_literals: ["ProjectAzrael", "10.0.0.5"]
  redact_patterns: []
  # redact_patterns:
  #   - 'password\s*=\s*(\S+)'
  #   - '(?i)secret["\s:=]+([A-Za-z0-9_\-]{8,})'
  redact_replacement: "[REDACTED]"

  # --- PasteGuard-style privacy masking (port of sgasser/pasteguard) ------
  # Detected values become [[TYPE_N]] placeholders on the way to the LLM and
  # are restored in its output, so the operator's report keeps the evidence
  # while a third-party/local model never receives the real values.
  # CLI: --mask-pii / --mask-secrets / --no-mask-restore
  mask_pii: false                 # emails, IPs, phones, cards, IBANs, EU VAT
  mask_secrets: false             # API keys, JWTs, bearer, private keys, passwords, DSNs
  mask_restore: true              # put originals back in the model's output
  mask_show_markers: false        # prefix restored values with mask_marker_text
  mask_marker_text: "[protected]"
  mask_max_scan_chars: 200000     # chunk size; the WHOLE text is scanned
  mask_allowlist: []              # never mask: [{pattern: "Company Inc."}]
  mask_denylist: []               # always mask: [{pattern: 'CUST-\d{6}', type: CUSTOMER_ID, regex: true}]

  # --- snaffler-style sweep tool (smb_scan_share / --preset snaffler) ------
  scan_depth: 3                   # directory levels below the start path
  scan_max_files: 200             # candidate files opened per sweep
  scan_max_file_bytes: 65536      # bytes read per candidate file
  scan_tiers: [red, yellow]       # which triage tiers to open
  scan_use_default_patterns: true
  scan_extra_patterns: {}         # {name: regex}; same name replaces built-in
  # scan_extra_patterns:
  #   svc_account: '\bsvc-[a-z]+\b'

  # LLM
  model: claude-opus-5           # env SMBENUM_MODEL overrides
  max_tokens: 16000
  # Anthropic-compatible endpoint override (GLM / DeepSeek / any proxy).
  # Empty = official Anthropic API (ANTHROPIC_BASE_URL env is also respected).
  # examples: https://api.deepseek.com/anthropic · GLM: https://open.bigmodel.cn/api/anthropic
  api_base_url: ""
  api_key: ""                    # empty = ANTHROPIC_API_KEY env
  # adaptive thinking is Anthropic-specific; it is auto-disabled when
  # api_base_url is set (override with CLI --thinking adaptive)
  thinking_mode: adaptive
