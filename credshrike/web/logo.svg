<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="CredShrike logo">
  <!-- CredShrike: the shrike (butcher bird) stores prey impaled on thorns.
       Here it perches beside a thorn with a key skewered on it; the black
       bandit-eye-mask nods to PasteGuard masking. Palette = report theme. -->
  <rect x="8" y="8" width="224" height="224" rx="46" fill="#101418" stroke="#26303a" stroke-width="2"/>
  <!-- tail -->
  <polygon points="86,156 58,198 98,168" fill="#2f6b9e"/>
  <polygon points="106,164 88,202 120,170" fill="#2f6b9e"/>
  <!-- wings -->
  <polygon points="96,162 158,92 160,130" fill="#2f6b9e"/>
  <polygon points="58,150 122,68 130,110" fill="#4da3ff"/>
  <!-- head + hooked beak (shrikes have a raptor-like hooked bill) -->
  <polygon points="126,102 178,116 134,132" fill="#4da3ff"/>
  <polygon points="178,116 168,126 180,128" fill="#2f6b9e"/>
  <!-- bandit mask + eye -->
  <polygon points="134,106 174,112 172,122 133,116" fill="#101418"/>
  <circle cx="154" cy="114" r="3.4" fill="#e8eef4"/>
  <!-- thorn (the shrike's larder spike) -->
  <polygon points="178,208 184,146 192,208" fill="#7d8a99"/>
  <polygon points="184,172 172,188 186,182" fill="#7d8a99"/>
  <!-- key impaled on the thorn -->
  <circle cx="150" cy="170" r="13" fill="none" stroke="#ff6b6b" stroke-width="8"/>
  <line x1="163" y1="170" x2="220" y2="170" stroke="#ff6b6b" stroke-width="8"/>
  <line x1="208" y1="170" x2="208" y2="190" stroke="#ff6b6b" stroke-width="8"/>
  <line x1="219" y1="170" x2="219" y2="186" stroke="#ff6b6b" stroke-width="8"/>
</svg>
